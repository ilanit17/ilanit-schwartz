<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס - מה למדנו היום</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --secondary: #FFB84D;
            --accent: #FF6B9D;
            --bg-light: #FFF9F0;
            --bg-white: #FFFFFF;
            --text-dark: #2C3E50;
            --text-gray: #6C757D;
            --border: #E8ECF1;
            --shadow: rgba(74, 144, 226, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFE8CC 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 184, 77, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(74, 144, 226, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: float 25s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--bg-white);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.08),
                0 8px 20px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .header-decoration {
            position: absolute;
            top: -20px;
            right: 50%;
            transform: translateX(50%);
            font-size: 4rem;
            opacity: 0.1;
            z-index: 0;
        }

        h1 {
            font-family: 'Amatic SC', cursive;
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-weight: 700;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 0 rgba(255, 184, 77, 0.3);
            animation: titleBounce 0.8s ease-out 0.2s both;
        }

        @keyframes titleBounce {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 1.1rem;
            font-weight: 300;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-section {
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.6s ease-out both;
        }

        .form-section:nth-child(2) { animation-delay: 0.1s; }
        .form-section:nth-child(3) { animation-delay: 0.2s; }
        .form-section:nth-child(4) { animation-delay: 0.3s; }
        .form-section:nth-child(5) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--secondary), var(--accent));
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Heebo', sans-serif;
            font-size: 1rem;
            color: var(--text-dark);
            background: var(--bg-light);
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            border-color: var(--primary);
            background: var(--bg-white);
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-2px);
        }

        input[type="text"]:hover,
        input[type="date"]:hover,
        textarea:hover {
            border-color: var(--primary);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        .emoji-icon {
            font-size: 1.5rem;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 640px) {
            .info-row {
                grid-template-columns: 1fr;
            }
        }

        .footer-message {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.1), rgba(255, 184, 77, 0.1));
            border-radius: 16px;
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .footer-message p {
            color: var(--primary-dark);
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .footer-message .heart {
            color: var(--accent);
            font-size: 1.5rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .print-button {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 2rem auto 0;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Heebo', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .print-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .print-button:active {
            transform: translateY(-1px);
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            body::before,
            body::after {
                display: none;
            }

            .card {
                box-shadow: none;
                padding: 2rem;
            }

            .print-button {
                display: none;
            }

            input[type="text"],
            input[type="date"],
            textarea {
                border: 1px solid #ccc;
                background: white;
            }
        }

        @media (max-width: 768px) {
            .card {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 2.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="header-decoration">✏️</div>
                <h1>מה למדנו היום?</h1>
                <p class="subtitle">טופס למעקב אחר תלמידים חסרים</p>
            </div>

            <form>
                <div class="form-section">
                    <div class="section-title">
                        <span class="emoji-icon">📅</span>
                        פרטים כלליים
                    </div>
                    <div class="info-row">
                        <div class="form-group">
                            <label for="date">תאריך</label>
                            <input type="date" id="date" name="date">
                        </div>
                        <div class="form-group">
                            <label for="student-name">שם התלמיד/ה</label>
                            <input type="text" id="student-name" name="student-name" placeholder="הזן/י את שם התלמיד/ה">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">
                        <span class="emoji-icon">📚</span>
                        המקצוע
                    </div>
                    <div class="form-group">
                        <label for="subject">שם המקצוע</label>
                        <input type="text" id="subject" name="subject" placeholder="לדוגמה: מתמטיקה, עברית, מדעים...">
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">
                        <span class="emoji-icon">📖</span>
                        מה למדנו היום
                    </div>
                    <div class="form-group">
                        <label for="content">תוכן השיעור והנושאים שנלמדו</label>
                        <textarea id="content" name="content" placeholder="תאר/י את הנושאים שנלמדו, הפעילויות שבוצעו, והדברים החשובים מהשיעור..."></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">
                        <span class="emoji-icon">✅</span>
                        משימות להשלמה
                    </div>
                    <div class="form-group">
                        <label for="tasks">שיעורי בית ומשימות שיש להשלים</label>
                        <textarea id="tasks" name="tasks" placeholder="פרט/י את המשימות, דפי העבודה, עמודים בספר, או כל דבר אחר שהתלמיד/ה צריכ/ה להשלים..."></textarea>
                    </div>
                </div>

                <button type="button" class="print-button" onclick="window.print()">
                    🖨️ הדפס טופס
                </button>
            </form>

            <div class="footer-message">
                <p>מקווים שתחזור/תחזרי בקרוב! <span class="heart">💙</span></p>
            </div>
        </div>
    </div>
</body>
</html>
