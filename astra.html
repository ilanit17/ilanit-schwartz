                  font-size: 0.9rem;
                  font-weight: 500;
                  cursor: pointer;
                  font-family: inherit;
                  transition: all 0.2s;
                }

                .tab:hover {
                  border-color: #7C3AED;
                }

                .tab.active {
                  background: #7C3AED;
                  color: white;
                  border-color: #7C3AED;
                }

                .tab-content {
                  background: white;
                  border-radius: 20px;
                  padding: 28px;
                }

                .tab-content h2 {
                  font-size: 1.3rem;
                  color: #1e293b;
                  margin-bottom: 18px;
                }

                .teaching-steps {
                  list-style: none;
                  display: flex;
                  flex-direction: column;
                  gap: 14px;
                }

                .teaching-steps li {
                  display: flex;
                  align-items: flex-start;
                  gap: 14px;
                  padding: 14px;
                  background: #f8fafc;
                  border-radius: 12px;
                }

                .step-number {
                  background: linear-gradient(135deg, #7C3AED, #a855f7);
                  color: white;
                  width: 30px;
                  height: 30px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-weight: 700;
                  flex-shrink: 0;
                  font-size: 0.9rem;
                }

                .step-text {
                  font-size: 1rem;
                  color: #334155;
                  line-height: 1.5;
                }

                .tip-box {
                  margin-top: 20px;
                  padding: 14px 18px;
                  background: #fef3c7;
                  border-radius: 12px;
                  border-right: 4px solid #f59e0b;
                  color: #92400e;
                  font-size: 0.95rem;
                }

                .example-box {
                  background: #f1f5f9;
                  padding: 18px;
                  border-radius: 12px;
                  margin-bottom: 20px;
                  border-right: 4px solid #059669;
                }

                .example-box pre {
                  white-space: pre-wrap;
                  font-family: inherit;
                  color: #334155;
                  line-height: 1.6;
                  font-size: 0.95rem;
                }

                .activity-box {
                  background: #ede9fe;
                  padding: 18px;
                  border-radius: 12px;
                  color: #5b21b6;
                  border-right: 4px solid #7C3AED;
                  font-size: 0.95rem;
                }

                .navigation-card {
                  background: linear-gradient(135deg, #faf5ff, #f5f3ff);
                  border: 3px solid var(--accent-color);
                  border-radius: 20px;
                  padding: 24px;
                  max-width: 380px;
                  margin: 0 auto;
                }

                .nav-card-header {
                  display: flex;
                  align-items: center;
                  gap: 12px;
                  margin-bottom: 18px;
                  padding-bottom: 14px;
                  border-bottom: 2px dashed var(--accent-color);
                }

                .nav-card-header span {
                  font-size: 28px;
                }

                .nav-card-header h3 {
                  font-size: 1.1rem;
                  color: #1e293b;
                }

                .nav-card-questions {
                  list-style: none;
                  display: flex;
                  flex-direction: column;
                  gap: 10px;
                }

                .nav-card-questions li {
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  font-size: 0.95rem;
                  color: #334155;
                }

                .question-bullet {
                  background: var(--accent-color);
                  color: white;
                  width: 22px;
                  height: 22px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-weight: 700;
                  font-size: 0.8rem;
                  flex-shrink: 0;
                }

                .card-instruction {
                  text-align: center;
                  margin-top: 18px;
                  color: #64748b;
                  font-size: 0.85rem;
                }

                .metacog-cards {
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                  gap: 16px;
                }

                .metacog-card {
                  background: #f8fafc;
                  border-radius: 14px;
                  padding: 20px;
                  border: 2px solid #e2e8f0;
                }

                .metacog-card h3 {
                  font-size: 1rem;
                  color: #1e293b;
                  margin-bottom: 14px;
                  padding-bottom: 10px;
                  border-bottom: 2px solid #7C3AED;
                }

                .metacog-card ul {
                  list-style: none;
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
                }

                .metacog-card li {
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  color: #334155;
                  font-size: 0.9rem;
                }

                .checkbox {
                  font-size: 1.1rem;
                  color: #7C3AED;
                }

                .structures-grid {
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                  gap: 14px;
                }

                .structure-card {
                  background: #f8fafc;
                  border-radius: 12px;
                  padding: 18px;
                  border-right: 4px solid #059669;
                }

                .structure-card h3 {
                  color: #059669;
                  margin-bottom: 6px;
                  font-size: 1rem;
                }

                .structure-card p {
                  color: #475569;
                  font-size: 0.9rem;
                }

                .graded-list {
                  list-style: none;
                  display: flex;
                  flex-direction: column;
                  gap: 10px;
                }

                .graded-list li {
                  display: flex;
                  align-items: center;
                  gap: 14px;
                  padding: 14px;
                  background: #f8fafc;
                  border-radius: 12px;
                  font-size: 0.95rem;
                }

                .level-badge {
                  background: linear-gradient(135deg, #059669, #10b981);
                  color: white;
                  padding: 5px 12px;
                  border-radius: 16px;
                  font-size: 0.8rem;
                  font-weight: 600;
                  white-space: nowrap;
                }

                .summary-steps-list {
                  list-style: none;
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                  gap: 10px;
                }

                .summary-steps-list li {
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  padding: 12px;
                  background: #f8fafc;
                  border-radius: 10px;
                  font-size: 0.9rem;
                }

                .step-badge {
                  background: #DC2626;
                  color: white;
                  width: 26px;
                  height: 26px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-weight: 700;
                  font-size: 0.8rem;
                  flex-shrink: 0;
                }

                .difficulties-view h1 {
                  text-align: center;
                  font-size: 1.5rem;
                  color: #1e293b;
                  margin-bottom: 20px;
                }

                .difficulties-table {
                  background: white;
                  border-radius: 20px;
                  overflow: hidden;
                  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
                }

                .table-header {
                  display: grid;
                  grid-template-columns: 1fr 1.2fr 1.5fr;
                  background: linear-gradient(135deg, #7C3AED, #a855f7);
                  color: white;
                  font-weight: 600;
                  padding: 14px 18px;
                  font-size: 0.95rem;
                }

                .table-row {
                  display: grid;
                  grid-template-columns: 1fr 1.2fr 1.5fr;
                  padding: 14px 18px;
                  border-bottom: 1px solid #e2e8f0;
                  font-size: 0.9rem;
                }

                .table-row:nth-child(even) {
                  background: #f8fafc;
                }

                .table-row:last-child {
                  border-bottom: none;
                }

                .col-problem {
                  font-weight: 600;
                  color: #DC2626;
                }

                .col-cause {
                  color: #64748b;
                }

                .col-solution {
                  color: #059669;
                }

                @media (max-width: 768px) {
                  .app-container {
                    padding: 16px;
                  }

                  .hero-section h1 {
                    font-size: 1.5rem;
                  }

                  .strategy-header {
                    flex-direction: column;
                  }

                  .tabs {
                    overflow-x: auto;
                    flex-wrap: nowrap;
                    padding-bottom: 8px;
                  }

                  .tab {
                    white-space: nowrap;
                    font-size: 0.85rem;
                    padding: 8px 14px;
                  }

                  .table-header, .table-row {
                    grid-template-columns: 1fr;
                    gap: 6px;
                  }
                }
              `}</style>

              {activeView === 'home' && renderHome()}
              {activeView === 'category' && renderCategory()}
              {activeView === 'strategy' && renderStrategy()}
              {activeView === 'difficulties' && renderDifficulties()}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReadingStrategiesApp />);
    </script>
</body>
</html>
